<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Accept assistant invitation | Princess Dog Walker</title><link rel="stylesheet" href="css/styles.css"></head><body><aside style="padding:12px;text-align:center;background:#fff0bd;color:#332b18">Local showcase demo · fictional data · no live bookings or emails</aside><main class="container section-sm"><h1>Join as an Assistant / Pet Sitter</h1><p>Use the email address that received your invitation. Invitations expire after 48 hours.</p><form id="assistant-setup" class="profile-panel"><div class="field"><label for="name">Full name</label><input id="name" name="fullName" autocomplete="name" maxlength="120" required></div><div class="field"><label for="email">Invited email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Create password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="100" required><p class="hint">At least 8 characters including a number.</p></div><button class="button" type="submit">Create assistant account</button></form><p id="invite-status" role="status"></p><a href="auth.html">Sign in</a></main><script src="js/api.js"></script><script src="js/assistant-invite.js"></script></body></html>
